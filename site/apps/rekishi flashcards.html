  <main class="app-shell">

  <script id="embedded-application">
(() => {
  "use strict";

  const DAY = 24 * 60 * 60 * 1000;
  const storageKey = "rekishi-card-records-v1";
  const favoritesKey = "rekishi-card-favorites-v1";
  const customCardsKey = "rekishi-card-custom-v1";
  const elementaryCards = (window.HISTORY_CARDS || []).map((item) => ({ ...item, level: "elementary" }));
  const middleCards = (window.MIDDLE_HISTORY_CARDS || []).map((item) => ({ ...item, level: "middle" }));
  const baseCards = [...elementaryCards, ...middleCards];
  const baseEraOrder = [...(window.ERA_ORDER || [])];
  let customCards = safeLoad(customCardsKey, []);
  let cards = [];
  let eraOrder = [];
  let testTimerId = null;

  function safeLoad(key, fallback) {
    try {
      const value = JSON.parse(localStorage.getItem(key) || "null");
      return value ?? fallback;
    } catch (_error) {
      return fallback;
    }
  }

  function safeSave(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (_error) {
      // 保存できない環境でも現在の学習は続けられます。
    }
  }

  function rebuildCards() {
    customCards = Array.isArray(customCards) ? customCards.filter((item) => item && item.id && item.term && item.clue) : [];
    cards = [...baseCards, ...customCards];
    const customEras = customCards.map((item) => item.era).filter(Boolean);
    eraOrder = [...new Set([...baseEraOrder, ...customEras])];
  }

  rebuildCards();

  const elements = {
    filterPanel: document.getElementById("filterPanel"),
    filterBackdrop: document.getElementById("filterBackdrop"),
    openFilters: document.getElementById("openFilters"),
    closeFilters: document.getElementById("closeFilters"),
    furiganaToggle: document.getElementById("furiganaToggle"),
    elementaryLevel: document.getElementById("elementaryLevel"),
    middleLevel: document.getElementById("middleLevel"),
    allLevels: document.getElementById("allLevels"),
    toggleAllEras: document.getElementById("toggleAllEras"),
    eraGrid: document.getElementById("eraGrid"),
    categorySelect: document.getElementById("categorySelect"),
    clueDirection: document.getElementById("clueDirection"),
    termDirection: document.getElementById("termDirection"),
    choiceDirection: document.getElementById("choiceDirection"),
    randomToggle: document.getElementById("randomToggle"),
    reviewToggle: document.getElementById("reviewToggle"),
    weakTotalCount: document.getElementById("weakTotalCount"),
    unsureReviewCount: document.getElementById("unsureReviewCount"),
    wrongReviewCount: document.getElementById("wrongReviewCount"),
    weakReviewCount: document.getElementById("weakReviewCount"),
    savedWeakCount: document.getElementById("savedWeakCount"),
    startLearning: document.getElementById("startLearning"),
    selectedCount: document.getElementById("selectedCount"),
    dueCount: document.getElementById("dueCount"),
    viewTabs: document.getElementById("viewTabs"),
    studyHeader: document.getElementById("studyHeader"),
    studyTitle: document.getElementById("studyTitle"),
    activeFilters: document.getElementById("activeFilters"),
    againCount: document.getElementById("againCount"),
    unsureCount: document.getElementById("unsureCount"),
    masteredCountSession: document.getElementById("masteredCountSession"),
    studyContent: document.getElementById("studyContent"),
    overallCard: document.getElementById("overallCard"),
    overallMessage: document.getElementById("overallMessage"),
    overallMeter: document.getElementById("overallMeter"),
    overallPercent: document.getElementById("overallPercent"),
    totalCards: document.getElementById("totalCards"),
    studiedCards: document.getElementById("studiedCards"),
    masteredCards: document.getElementById("masteredCards"),
    resetProgress: document.getElementById("resetProgress"),
  };

  const state = {
    view: "study",
    selectedEras: new Set(eraOrder),
    schoolLevel: "elementary",
    category: "すべて",
    direction: "clue",
    randomOrder: true,
    reviewOnly: false,
    focusMode: "none",
    furigana: true,
    seed: Date.now(),
    index: 0,
    revealed: false,
    selectedChoice: null,
    filtersOpen: false,
    records: safeLoad(storageKey, {}),
    favorites: new Set(safeLoad(favoritesKey, [])),
    session: { mastered: 0, unsure: 0, again: 0 },
    listSearch: "",
    listEra: "すべて",
    listCategory: "すべて",
    testSize: "10",
    testTimed: false,
    testMinutes: 5,
    testSession: null,
    timelineEra: "すべて",
    timelineQuiz: null,
    importMessage: "",
  };

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function stableShuffleValue(id, seed) {
    let value = seed || 1;
    for (let index = 0; index < id.length; index += 1) {
      value = Math.imul(value ^ id.charCodeAt(index), 2654435761);
    }
    return value >>> 0;
  }

  function getCard(id) {
    return cards.find((item) => item.id === id);
  }

  function getLevelCards() {
    return cards.filter((item) => state.schoolLevel === "all" || item.level === state.schoolLevel);
  }

  function levelLabel() {
    if (state.schoolLevel === "middle") return "中学生";
    if (state.schoolLevel === "all") return "小中学生";
    return "小学生";
  }

  function isDue(item, now = Date.now()) {
    const record = state.records[item.id];
    if (!record) return false;
    if (Number.isFinite(record.dueAt)) return record.dueAt <= now;
    return ["again", "unsure"].includes(record.rating) || record.lastTestResult === "wrong";
  }

  function isUnsure(item) {
    return state.records[item.id]?.rating === "unsure";
  }

  function isWrong(item) {
    return state.records[item.id]?.lastTestResult === "wrong";
  }

  function isWeak(item) {
    const record = state.records[item.id];
    return Boolean(record && (["again", "unsure"].includes(record.rating) || record.lastTestResult === "wrong"));
  }

  function matchesBaseFilters(item) {
    if (state.schoolLevel !== "all" && item.level !== state.schoolLevel) return false;
    if (!state.selectedEras.has(item.era)) return false;
    if (state.category !== "すべて" && item.category !== state.category) return false;
    return true;
  }

  function matchesFocusMode(item) {
    if (state.focusMode === "unsure") return isUnsure(item);
    if (state.focusMode === "wrong") return isWrong(item);
    if (state.focusMode === "weak") return isWeak(item);
    return true;
  }

  function studyModeTitle() {
    if (state.focusMode === "unsure") return "あやしい問題を復習";
    if (state.focusMode === "wrong") return "まちがえた問題を復習";
    if (state.focusMode === "weak") return "苦手をまとめて復習";
    if (state.reviewOnly) return "今日の復習";
    return "歴史の流れをつかもう";
  }

  function dueText(item) {
    const record = state.records[item.id];
    if (!record) return "未学習";
    if (isDue(item)) return "今日復習";
    if (!Number.isFinite(record.dueAt)) return "復習日未設定";
    return `${new Intl.DateTimeFormat("ja-JP", { month: "numeric", day: "numeric" }).format(record.dueAt)}に復習`;
  }

  function saveRecords() {
    safeSave(storageKey, state.records);
  }

  function saveFavorites() {
    safeSave(favoritesKey, [...state.favorites]);
  }

  function getDeck() {
    const filtered = cards.filter((item) => {
      if (!matchesBaseFilters(item)) return false;
      if (state.reviewOnly && !isDue(item)) return false;
      if (!matchesFocusMode(item)) return false;
      return true;
    });

    return filtered.sort((a, b) => {
      if (state.randomOrder) {
        return stableShuffleValue(a.id, state.seed) - stableShuffleValue(b.id, state.seed);
      }
      const eraDifference = eraOrder.indexOf(a.era) - eraOrder.indexOf(b.era);
      return eraDifference || cards.indexOf(a) - cards.indexOf(b);
    });
  }

  function getChoices(current, choiceSeed = state.seed) {
    const rankedPool = getLevelCards()
      .filter((item) => item.id !== current.id && item.term !== current.term)
      .sort((a, b) => {
        const rank = (item) => (item.era === current.era ? 0 : 2) + (item.category === current.category ? 0 : 1);
        const difference = rank(a) - rank(b);
        return difference || stableShuffleValue(`${current.id}:${a.id}`, choiceSeed) - stableShuffleValue(`${current.id}:${b.id}`, choiceSeed);
      });

    const seenTerms = new Set([current.term]);
    const distractors = [];
    for (const item of rankedPool) {
      if (seenTerms.has(item.term)) continue;
      seenTerms.add(item.term);
      distractors.push(item);
      if (distractors.length === 3) break;
    }

    return [current, ...distractors].sort(
      (a, b) => stableShuffleValue(`choice:${current.id}:${a.id}`, choiceSeed) - stableShuffleValue(`choice:${current.id}:${b.id}`, choiceSeed),
    );
  }

  function termMarkup(item) {
    const term = escapeHtml(item.term);
    if (!item.reading) return term;
    const readingClass = state.furigana ? "" : ' class="hide-reading"';
    return `<ruby${readingClass}>${term}<rt>${escapeHtml(item.reading)}</rt></ruby>`;
  }

  function setFilterOpen(open) {
    state.filtersOpen = open;
    elements.filterPanel.classList.toggle("open", open);
    elements.filterBackdrop.hidden = !open;
    document.body.classList.toggle("filters-visible", open);
  }

  function resetCardPosition() {
    state.index = 0;
    state.revealed = false;
    state.selectedChoice = null;
  }

  function setView(view) {
    state.view = view;
    setFilterOpen(false);
    render();
  }

  function renderViewTabs() {
    elements.viewTabs.querySelectorAll("[data-view]").forEach((button) => {
      const active = button.dataset.view === state.view;
      button.classList.toggle("active", active);
      button.setAttribute("aria-current", active ? "page" : "false");
    });
  }

  function renderEraButtons() {
    elements.eraGrid.innerHTML = eraOrder.map((era) => {
      const active = state.selectedEras.has(era);
      return `<button class="era-chip${active ? " active" : ""}" type="button" data-era="${escapeHtml(era)}" aria-pressed="${active}"><span class="check">✓</span>${escapeHtml(era)}</button>`;
    }).join("");

    elements.eraGrid.querySelectorAll("[data-era]").forEach((button) => {
      button.addEventListener("click", () => {
        const era = button.dataset.era;
        if (state.selectedEras.has(era)) state.selectedEras.delete(era);
        else state.selectedEras.add(era);
        resetCardPosition();
        render();
      });
    });
  }

  function renderCategoryOptions() {
    const categories = ["すべて", ...new Set(getLevelCards().map((item) => item.category))].sort((a, b) => {
      if (a === "すべて") return -1;
      if (b === "すべて") return 1;
      return a.localeCompare(b, "ja");
    });
    if (!categories.includes(state.category)) state.category = "すべて";
    elements.categorySelect.innerHTML = categories.map((item) => `<option value="${escapeHtml(item)}">${escapeHtml(item)}</option>`).join("");
    elements.categorySelect.value = state.category;
  }

  function selectChoice(choiceId) {
    if (state.direction !== "choice" || state.revealed) return;
    const current = getDeck()[state.index];
    if (!current) return;
    state.selectedChoice = choiceId;
    state.revealed = true;
    render();
  }

  function choiceButtonsMarkup(current, choices, selectedId, revealed, dataName = "choice") {
    return choices.map((item, index) => {
      const isCorrect = item.id === current.id;
      const isSelected = item.id === selectedId;
      const resultClass = revealed ? isCorrect ? " correct" : isSelected ? " wrong" : " dimmed" : isSelected ? " selected" : "";
      return `<button class="choice-button${resultClass}" type="button" data-${dataName}="${escapeHtml(item.id)}" aria-pressed="${isSelected}" ${revealed ? "disabled" : ""}>
        <span class="choice-key">${index + 1}</span>
        <strong>${termMarkup(item)}</strong>
        ${revealed && isCorrect ? '<span class="choice-mark" aria-label="正解">✓</span>' : ""}
        ${revealed && isSelected && !isCorrect ? '<span class="choice-mark" aria-label="不正解">×</span>' : ""}
      </button>`;
    }).join("");
  }

  function renderStudy(deck) {
    if (!deck.length) {
      const focused = state.focusMode !== "none";
      elements.studyContent.innerHTML = `
        <div class="empty-state">
          <span aria-hidden="true">◎</span>
          <h2>${focused ? "この種類の苦手問題はありません" : state.reviewOnly ? "今日の復習は完了です" : "カードが見つかりません"}</h2>
          <p>${focused ? "別の苦手復習を選ぶか、通常学習に戻してください。" : state.reviewOnly ? "復習予定のカードはありません。通常学習に戻すか、別の条件を選んでください。" : "時代または分野の選択を変えてください。"}</p>
          <button id="showAllCards" type="button">通常学習に戻す</button>
        </div>`;
      document.getElementById("showAllCards").addEventListener("click", () => {
        state.selectedEras = new Set(eraOrder);
        state.category = "すべて";
        state.reviewOnly = false;
        state.focusMode = "none";
        resetCardPosition();
        render();
      });
      return;
    }

    if (state.index >= deck.length) state.index = 0;
    const current = deck[state.index];
    const isChoiceMode = state.direction === "choice";
    const choices = isChoiceMode ? getChoices(current) : [];
    const progress = ((state.index + 1) / deck.length) * 100;
    const questionBody = state.direction === "clue" || isChoiceMode
      ? `<p class="clue-text">${escapeHtml(current.clue)}</p>`
      : `<h2 class="term-front">${termMarkup(current)}</h2>`;
    const answerBody = state.direction === "clue" || isChoiceMode
      ? `<h2>${termMarkup(current)}</h2><p class="answer-explanation">${escapeHtml(current.clue)}</p>`
      : `<p class="answer-clue">${escapeHtml(current.clue)}</p>`;
    const selectedIsCorrect = state.selectedChoice === current.id;
    const revealedAnswer = state.revealed
      ? `<div class="answer-panel">
          <p class="answer-label">ANSWER</p>
          ${isChoiceMode ? `<p class="choice-feedback ${selectedIsCorrect ? "correct" : "wrong"}" role="status">${selectedIsCorrect ? "正解！" : "不正解。正解はこちらです"}</p>` : ""}
          ${answerBody}
          ${current.note ? `<p class="teacher-note">補足：${escapeHtml(current.note)}</p>` : ""}
        </div>`
      : "";
    const answerArea = isChoiceMode
      ? `<div class="choice-grid" role="group" aria-label="4つの選択肢">${choiceButtonsMarkup(current, choices, state.selectedChoice, state.revealed)}</div>${revealedAnswer}`
      : state.revealed ? revealedAnswer : `<button class="reveal-button" id="revealAnswer" type="button">答えを見る <kbd>Space</kbd></button>`;
    const keyboardHelp = isChoiceMode
      ? state.revealed ? "← → で移動　・　1〜3で評価" : "← → で移動　・　1〜4で選択"

    elements.studyContent.innerHTML = `
      <div class="progress-row">
        <div class="progress-copy"><span>${state.index + 1}</span> / ${deck.length}</div>
        <div class="progress-track"><span style="width:${progress}%"></span></div>
        <button class="icon-button" id="reshuffleCards" type="button" aria-label="カードを並べ替える" title="並べ替える">↻</button>
      </div>
      <article class="flashcard${state.revealed ? " revealed" : ""}${isChoiceMode ? " choice-mode" : ""}">
        <div class="card-meta">
          <span class="era-tag">${escapeHtml(current.era)}</span>
          <span>${escapeHtml(current.category)}</span>
          <span class="schedule-tag">${escapeHtml(dueText(current))}</span>
          ${current.year ? `<span class="year">${escapeHtml(current.year)}</span>` : ""}
        </div>
        <div class="card-question">
          <p class="question-label">${isChoiceMode ? "説明にあてはまる語句を1つ選ぼう" : state.direction === "clue" ? "この説明にあてはまる語句は？" : "この語句を説明してみよう"}</p>
          ${questionBody}
        </div>
        ${answerArea}
      </article>
      <div class="card-navigation">
        <button class="nav-button" id="previousCard" type="button">← <span>前の問題</span></button>
        <div class="rating-group" aria-label="自己評価">
          <button class="rating again" data-rating="again" type="button" ${state.revealed ? "" : "disabled"}><span>1</span> もう一度</button>
          <button class="rating unsure" data-rating="unsure" type="button" ${state.revealed ? "" : "disabled"}><span>2</span> あやしい</button>
          <button class="rating mastered" data-rating="mastered" type="button" ${state.revealed ? "" : "disabled"}><span>3</span> 覚えた</button>
        </div>
        <button class="nav-button" id="nextCard" type="button"><span>次の問題</span> →</button>
      </div>
      <p class="keyboard-help">${keyboardHelp}</p>`;

    document.getElementById("reshuffleCards").addEventListener("click", () => {
      state.seed = Date.now();
      resetCardPosition();
      render();
    });
    document.getElementById("previousCard").addEventListener("click", previousCard);
    document.getElementById("nextCard").addEventListener("click", nextCard);
    document.getElementById("revealAnswer")?.addEventListener("click", () => {
      state.revealed = true;
      render();
    });
    elements.studyContent.querySelectorAll("[data-choice]").forEach((button) => {
      button.addEventListener("click", () => selectChoice(button.dataset.choice));
    });
    elements.studyContent.querySelectorAll("[data-rating]").forEach((button) => {
      button.addEventListener("click", () => rateCard(button.dataset.rating));
    });
  }

  function renderOverall() {
    const levelCards = getLevelCards();
    const knownIds = new Set(levelCards.map((item) => item.id));
    const validRecords = Object.entries(state.records).filter(([id]) => knownIds.has(id));
    const studied = validRecords.length;
    const mastered = validRecords.filter(([, item]) => item.rating === "mastered").length;
    const percent = levelCards.length ? Math.round((mastered / levelCards.length) * 100) : 0;
    elements.totalCards.textContent = levelCards.length;
    elements.studiedCards.textContent = studied;
    elements.masteredCards.textContent = mastered;
    elements.overallPercent.textContent = percent;
    elements.overallMessage.textContent = `${studied}語に挑戦済み。今日の復習は${levelCards.filter((item) => isDue(item)).length}語です。`;
    elements.overallMeter.style.setProperty("--progress", `${percent * 3.6}deg`);
  }

  function previousCard() {
    const deck = getDeck();
    if (!deck.length) return;
    state.index = (state.index - 1 + deck.length) % deck.length;
    state.revealed = false;
    state.selectedChoice = null;
    render();
  }

  function nextCard() {
    const deck = getDeck();
    if (!deck.length) return;
    state.index = (state.index + 1) % deck.length;
    state.revealed = false;
    state.selectedChoice = null;
    render();
  }

  function rateCard(rating) {
    const deckBefore = getDeck();
    const current = deckBefore[state.index];
    if (!current || !state.revealed || !["again", "unsure", "mastered"].includes(rating)) return;

    const previous = state.records[current.id] || {};
    let intervalDays = 0;
    if (rating === "unsure") intervalDays = 1;
    if (rating === "mastered") intervalDays = previous.rating === "mastered" ? Math.min(Math.max(previous.intervalDays || 3, 3) * 2, 60) : 3;
    state.records[current.id] = {
      rating,
      attempts: (previous.attempts || 0) + 1,
      updatedAt: Date.now(),
      intervalDays,
      dueAt: Date.now() + intervalDays * DAY,
      lastTestResult: rating === "mastered" ? "correct" : previous.lastTestResult,
    };
    state.session[rating] += 1;
    saveRecords();
    state.revealed = false;
    state.selectedChoice = null;

    const deckAfter = getDeck();
    if (!deckAfter.length) state.index = 0;
    else if (state.focusMode !== "none") {
      const currentIndex = deckAfter.findIndex((item) => item.id === current.id);
      state.index = currentIndex === -1 ? state.index % deckAfter.length : rating === "again" ? currentIndex : (currentIndex + 1) % deckAfter.length;
    }
    else if (state.reviewOnly) state.index %= deckAfter.length;
    else state.index = (state.index + 1) % deckAfter.length;
    window.setTimeout(render, 100);
  }

  function clearTestTimer() {
    if (testTimerId) window.clearInterval(testTimerId);
    testTimerId = null;
  }

  function startTestTimer() {
    clearTestTimer();
    if (!state.testSession?.timed || state.testSession.finished) return;
    testTimerId = window.setInterval(() => {
      if (!state.testSession || state.testSession.finished) return clearTestTimer();
      state.testSession.remainingSeconds -= 1;
      if (state.testSession.remainingSeconds <= 0) finishTest();
      else {
        const timer = document.getElementById("testTimer");
        if (timer) timer.textContent = formatSeconds(state.testSession.remainingSeconds);
      }
    }, 1000);
  }

  function formatSeconds(seconds) {
    return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
  }

  function startTest() {
    const seed = Date.now();
    const pool = [...getDeck()].sort((a, b) => stableShuffleValue(a.id, seed) - stableShuffleValue(b.id, seed));
    const requested = state.testSize === "all" ? pool.length : Number(state.testSize);
    const selected = pool.slice(0, Math.min(requested, pool.length));
    if (!selected.length) {
      state.testSession = null;
      renderTestView("この条件ではテスト問題がありません。条件を変更してください。");
      return;
    }
    state.testSession = {
      questions: selected.map((card, index) => ({
        cardId: card.id,
        choiceIds: getChoices(card, seed + index + 1).map((item) => item.id),
        selectedId: null,
      })),
      index: 0,
      timed: state.testTimed,
      remainingSeconds: state.testTimed ? state.testMinutes * 60 : 0,
      finished: false,
      startedAt: Date.now(),
    };
    startTestTimer();
    render();
  }

  function chooseTestAnswer(choiceId) {
    const session = state.testSession;
    if (!session || session.finished) return;
    session.questions[session.index].selectedId = choiceId;
    render();
  }

  function nextTestQuestion() {
    const session = state.testSession;
    if (!session || session.finished || !session.questions[session.index].selectedId) return;
    if (session.index >= session.questions.length - 1) finishTest();
    else {
      session.index += 1;
      render();
    }
  }

  function finishTest() {
    if (!state.testSession || state.testSession.finished) return;
    state.testSession.finished = true;
    state.testSession.finishedAt = Date.now();
    state.testSession.questions.forEach((question) => {
      const previous = state.records[question.cardId] || {};
      const correct = question.selectedId === question.cardId;
      const nextRecord = {
        ...previous,
        testAttempts: (previous.testAttempts || 0) + 1,
        testCorrect: (previous.testCorrect || 0) + (correct ? 1 : 0),
        testWrong: (previous.testWrong || 0) + (correct ? 0 : 1),
        lastTestResult: correct ? "correct" : "wrong",
        lastTestAt: Date.now(),
        updatedAt: Date.now(),
      };
      if (!correct) nextRecord.dueAt = Date.now();
      else if (!previous.rating && previous.lastTestResult === "wrong") delete nextRecord.dueAt;
      state.records[question.cardId] = nextRecord;
    });
    saveRecords();
    clearTestTimer();
    render();
  }

  function renderTestView(message = "") {
    const session = state.testSession;
    if (!session) {
      const available = getDeck().length;
      elements.studyContent.innerHTML = `
        <section class="tool-view">
          <div class="view-heading"><div><p class="eyebrow">TEST MODE</p><h1>実力テスト</h1><p>正解は最後にまとめて表示します。現在の学年・時代・分野の条件が使われます。</p></div><span class="count-badge">対象 ${available}問</span></div>
          ${message ? `<p class="notice error">${escapeHtml(message)}</p>` : ""}
          <div class="settings-card">
            <label><span>問題数</span><select id="testSize"><option value="10" ${state.testSize === "10" ? "selected" : ""}>10問</option><option value="20" ${state.testSize === "20" ? "selected" : ""}>20問</option><option value="all" ${state.testSize === "all" ? "selected" : ""}>すべて</option></select></label>
            <label class="check-setting"><input id="testTimed" type="checkbox" ${state.testTimed ? "checked" : ""}><span>制限時間をつける</span></label>
            <label><span>制限時間</span><select id="testMinutes" ${state.testTimed ? "" : "disabled"}><option value="5" ${state.testMinutes === 5 ? "selected" : ""}>5分</option><option value="10" ${state.testMinutes === 10 ? "selected" : ""}>10分</option><option value="20" ${state.testMinutes === 20 ? "selected" : ""}>20分</option></select></label>
            <button class="primary-action" id="startTest" type="button" ${available ? "" : "disabled"}>テストを始める →</button>
          </div>
        </section>`;
      document.getElementById("testSize").addEventListener("change", (event) => { state.testSize = event.target.value; });
      document.getElementById("testTimed").addEventListener("change", (event) => { state.testTimed = event.target.checked; render(); });
      document.getElementById("testMinutes").addEventListener("change", (event) => { state.testMinutes = Number(event.target.value); });
      document.getElementById("startTest")?.addEventListener("click", startTest);
      return;
    }

    if (session.finished) {
      const correct = session.questions.filter((question) => question.selectedId === question.cardId).length;
      const percent = Math.round((correct / session.questions.length) * 100);
      const wrong = session.questions.filter((question) => question.selectedId !== question.cardId);
      elements.studyContent.innerHTML = `
        <section class="tool-view">
          <div class="result-summary"><p class="eyebrow">TEST RESULT</p><h1>${percent}点</h1><p>${session.questions.length}問中 ${correct}問正解</p><div class="result-bar"><span style="width:${percent}%"></span></div></div>
          <div class="result-actions"><button class="secondary-action" id="resetTest" type="button">設定に戻る</button><button class="primary-action" id="retryTest" type="button">もう一度挑戦</button>${wrong.length ? '<button class="weak-action" id="reviewWrongFromTest" type="button">まちがいだけ復習</button>' : ""}</div>
          <section class="review-results"><h2>間違えた問題・未回答</h2>${wrong.length ? wrong.map((question) => {
            const card = getCard(question.cardId);
            const selected = getCard(question.selectedId);
            return `<article><div><span class="era-tag">${escapeHtml(card.era)}</span><strong>${termMarkup(card)}</strong></div><p>${escapeHtml(card.clue)}</p><small>あなたの回答：${selected ? escapeHtml(selected.term) : "未回答"}</small></article>`;
          }).join("") : '<p class="perfect-message">全問正解です。すばらしい！</p>'}</section>
        </section>`;
      document.getElementById("resetTest").addEventListener("click", () => { state.testSession = null; render(); });
      document.getElementById("retryTest").addEventListener("click", startTest);
      document.getElementById("reviewWrongFromTest")?.addEventListener("click", () => {
        state.focusMode = "wrong";
        state.reviewOnly = false;
        state.view = "study";
        resetCardPosition();
        render();
      });
      return;
    }

    const question = session.questions[session.index];
    const current = getCard(question.cardId);
    const choices = question.choiceIds.map(getCard).filter(Boolean);
    elements.studyContent.innerHTML = `
      <section class="tool-view test-running">
        <div class="test-status"><strong>${session.index + 1} / ${session.questions.length}</strong>${session.timed ? `<span>残り <b id="testTimer">${formatSeconds(session.remainingSeconds)}</b></span>` : ""}<button id="finishTest" type="button">終了して採点</button></div>
        <div class="progress-track"><span style="width:${((session.index + 1) / session.questions.length) * 100}%"></span></div>
        <article class="test-question-card"><span class="era-tag">${escapeHtml(current.era)}</span><p>この説明にあてはまる語句は？</p><h2>${escapeHtml(current.clue)}</h2></article>
        <div class="choice-grid test-choices">${choiceButtonsMarkup(current, choices, question.selectedId, false, "test-choice")}</div>
        <button class="primary-action next-test" id="nextTest" type="button" ${question.selectedId ? "" : "disabled"}>${session.index === session.questions.length - 1 ? "採点する" : "次の問題へ"} →</button>
        <p class="test-note">回答は変更できます。正解は採点後に表示します。</p>
      </section>`;
    elements.studyContent.querySelectorAll("[data-test-choice]").forEach((button) => button.addEventListener("click", () => chooseTestAnswer(button.dataset.testChoice)));
    document.getElementById("nextTest").addEventListener("click", nextTestQuestion);
    document.getElementById("finishTest").addEventListener("click", finishTest);
  }

  function toggleFavorite(id) {
    if (state.favorites.has(id)) state.favorites.delete(id);
    else state.favorites.add(id);
    saveFavorites();
    renderListView();
  }

  function studyCard(id) {
    const item = getCard(id);
    if (!item) return;
    state.selectedEras = new Set([item.era]);
    state.category = item.category;
    state.reviewOnly = false;
    state.focusMode = "none";
    state.randomOrder = false;
    state.view = "study";
    state.revealed = false;
    state.selectedChoice = null;
    state.index = Math.max(0, getDeck().findIndex((card) => card.id === id));
    render();
  }

  function renderListView(refocus = false) {
    const levelCards = getLevelCards();
    const categories = ["すべて", ...new Set(levelCards.map((item) => item.category))].sort((a, b) => a.localeCompare(b, "ja"));
    const query = state.listSearch.trim().toLocaleLowerCase("ja");
    const filtered = levelCards.filter((item) => {
      if (state.listEra !== "すべて" && item.era !== state.listEra) return false;
      if (state.listCategory !== "すべて" && item.category !== state.listCategory) return false;
      if (!query) return true;
      return [item.term, item.reading, item.clue, item.year].some((value) => String(value || "").toLocaleLowerCase("ja").includes(query));
    });

    elements.studyContent.innerHTML = `
      <section class="tool-view">
        <div class="view-heading"><div><p class="eyebrow">CARD LIBRARY</p><h1>語句一覧</h1><p>語句・読み・説明から検索できます。星を付けてお気に入りにもできます。</p></div><span class="count-badge">${filtered.length}語</span></div>
        <div class="library-tools">
          <label class="search-box"><span aria-hidden="true">⌕</span><input id="listSearch" type="search" value="${escapeHtml(state.listSearch)}" placeholder="語句や説明を検索"></label>
          <select id="listEra"><option>すべて</option>${eraOrder.map((era) => `<option ${state.listEra === era ? "selected" : ""}>${escapeHtml(era)}</option>`).join("")}</select>
          <select id="listCategory">${categories.map((category) => `<option ${state.listCategory === category ? "selected" : ""}>${escapeHtml(category)}</option>`).join("")}</select>
        </div>
        <div class="term-list">${filtered.length ? filtered.map((item) => `
          <article class="term-row">
            <button class="favorite-button${state.favorites.has(item.id) ? " active" : ""}" data-favorite="${escapeHtml(item.id)}" type="button" aria-label="${state.favorites.has(item.id) ? "お気に入りから外す" : "お気に入りに追加"}">★</button>
            <div class="term-main"><div><span class="era-tag">${escapeHtml(item.era)}</span><span class="category-label">${escapeHtml(item.category)}</span></div><h2>${termMarkup(item)}</h2><p>${escapeHtml(item.clue)}</p><small>${escapeHtml(dueText(item))}${item.year ? ` ・ ${escapeHtml(item.year)}` : ""}</small></div>
            <button class="study-this" data-study-card="${escapeHtml(item.id)}" type="button">このカードで学習</button>
          </article>`).join("") : '<div class="empty-inline">条件に合う語句がありません。</div>'}</div>
      </section>`;

    const search = document.getElementById("listSearch");
    search.addEventListener("input", (event) => {
      state.listSearch = event.target.value;
      renderListView(true);
    });
    if (refocus) {
      search.focus();
      search.setSelectionRange(search.value.length, search.value.length);
    }
    document.getElementById("listEra").addEventListener("change", (event) => { state.listEra = event.target.value; renderListView(); });
    document.getElementById("listCategory").addEventListener("change", (event) => { state.listCategory = event.target.value; renderListView(); });
    elements.studyContent.querySelectorAll("[data-favorite]").forEach((button) => button.addEventListener("click", () => toggleFavorite(button.dataset.favorite)));
    elements.studyContent.querySelectorAll("[data-study-card]").forEach((button) => button.addEventListener("click", () => studyCard(button.dataset.studyCard)));
  }

  function groupProgress(items, key) {
    return [...new Set(items.map((item) => item[key]))].map((name) => {
      const group = items.filter((item) => item[key] === name);
      const studied = group.filter((item) => state.records[item.id]).length;
      const mastered = group.filter((item) => state.records[item.id]?.rating === "mastered").length;
      const due = group.filter((item) => isDue(item)).length;
      return { name, total: group.length, studied, mastered, due, percent: group.length ? Math.round((mastered / group.length) * 100) : 0 };
    });
  }

  function progressRows(groups, dataName) {
    return groups.map((group) => `<button class="progress-item" type="button" data-progress-${dataName}="${escapeHtml(group.name)}"><span class="progress-name">${escapeHtml(group.name)}</span><span class="mini-track"><i style="width:${group.percent}%"></i></span><strong>${group.percent}%</strong><small>${group.mastered}/${group.total}習得・復習${group.due}</small></button>`).join("");
  }

  function renderProgressView() {
    const items = getLevelCards();
    const eraGroups = groupProgress(items, "era").sort((a, b) => eraOrder.indexOf(a.name) - eraOrder.indexOf(b.name));
    const categoryGroups = groupProgress(items, "category").sort((a, b) => a.name.localeCompare(b.name, "ja"));
    const studied = items.filter((item) => state.records[item.id]).length;
    const mastered = items.filter((item) => state.records[item.id]?.rating === "mastered").length;
    const due = items.filter((item) => isDue(item)).length;
    elements.studyContent.innerHTML = `
      <section class="tool-view">
        <div class="view-heading"><div><p class="eyebrow">LEARNING REPORT</p><h1>学習状況</h1><p>苦手な時代や分野を選ぶと、その条件で学習を始められます。</p></div></div>
        <div class="stat-grid"><article><span>挑戦済み</span><strong>${studied}</strong><small>/ ${items.length}語</small></article><article><span>覚えた</span><strong>${mastered}</strong><small>語</small></article><article><span>今日の復習</span><strong>${due}</strong><small>語</small></article><article><span>お気に入り</span><strong>${[...state.favorites].filter((id) => items.some((item) => item.id === id)).length}</strong><small>語</small></article></div>
        <div class="progress-columns"><section class="report-card"><h2>時代別</h2>${progressRows(eraGroups, "era")}</section><section class="report-card"><h2>分野別</h2>${progressRows(categoryGroups, "category")}</section></div>
      </section>`;
    elements.studyContent.querySelectorAll("[data-progress-era]").forEach((button) => button.addEventListener("click", () => {
      state.selectedEras = new Set([button.dataset.progressEra]); state.category = "すべて"; state.reviewOnly = false; state.focusMode = "none"; state.view = "study"; resetCardPosition(); render();
    }));
    elements.studyContent.querySelectorAll("[data-progress-category]").forEach((button) => button.addEventListener("click", () => {
      state.selectedEras = new Set(eraOrder); state.category = button.dataset.progressCategory; state.reviewOnly = false; state.focusMode = "none"; state.view = "study"; resetCardPosition(); render();
    }));
  }

  function yearNumber(item) {
    const value = String(item.year || "");
    const match = value.match(/(\d{3,4})/);
    if (!match) return null;
    const year = Number(match[1]);
    return /紀元前/.test(value) ? -year : year;
  }

  function timelineCards() {
    return getLevelCards().filter((item) => yearNumber(item) !== null && (state.timelineEra === "すべて" || item.era === state.timelineEra)).sort((a, b) => yearNumber(a) - yearNumber(b) || a.term.localeCompare(b.term, "ja"));
  }

  function makeTimelineQuiz() {
    const seed = Date.now();
    const source = timelineCards();
    const chosen = [...source].sort((a, b) => stableShuffleValue(a.id, seed) - stableShuffleValue(b.id, seed)).slice(0, 4);
    state.timelineQuiz = {
      ids: chosen.sort((a, b) => stableShuffleValue(`quiz:${a.id}`, seed) - stableShuffleValue(`quiz:${b.id}`, seed)).map((item) => item.id),
      selected: [],
      result: null,
    };
    renderTimelineView();
  }

  function selectTimelineItem(id) {
    const quiz = state.timelineQuiz;
    if (!quiz || quiz.result !== null || quiz.selected.includes(id)) return;
    quiz.selected.push(id);
    if (quiz.selected.length === quiz.ids.length) {
      const correct = [...quiz.ids].sort((a, b) => yearNumber(getCard(a)) - yearNumber(getCard(b)));
      quiz.result = quiz.selected.every((idValue, index) => idValue === correct[index]);
      quiz.correct = correct;
    }
    renderTimelineView();
  }

  function renderTimelineView() {
    const items = timelineCards();
    const quiz = state.timelineQuiz;
    const remaining = quiz ? quiz.ids.filter((id) => !quiz.selected.includes(id)) : [];
    elements.studyContent.innerHTML = `
      <section class="tool-view">
        <div class="view-heading"><div><p class="eyebrow">TIMELINE</p><h1>歴史年表</h1><p>出来事の前後関係を確認し、年代順の並べ替えにも挑戦できます。</p></div><select id="timelineEra"><option>すべて</option>${eraOrder.map((era) => `<option ${state.timelineEra === era ? "selected" : ""}>${escapeHtml(era)}</option>`).join("")}</select></div>
        <section class="timeline-quiz"><div class="section-heading"><div><h2>年代並べ替えチャレンジ</h2><p>古い出来事から順番に選んでください。</p></div><button class="secondary-action" id="newTimelineQuiz" type="button">${quiz ? "別の問題" : "問題を作る"}</button></div>
          ${quiz ? `<div class="selected-order">${quiz.selected.length ? quiz.selected.map((id, index) => `<span><b>${index + 1}</b>${escapeHtml(getCard(id).term)}</span>`).join("") : "まだ選ばれていません"}</div>
          ${quiz.result === null ? `<div class="timeline-options">${remaining.map((id) => `<button type="button" data-timeline-choice="${escapeHtml(id)}">${escapeHtml(getCard(id).term)}</button>`).join("")}</div>` : `<div class="timeline-answer ${quiz.result ? "correct" : "wrong"}"><strong>${quiz.result ? "正解！" : "もう一度確認しよう"}</strong><p>正しい順番：${quiz.correct.map((id) => `${escapeHtml(getCard(id).year)} ${escapeHtml(getCard(id).term)}`).join(" → ")}</p><button id="retryTimelineQuiz" type="button">同じ問題をやり直す</button></div>`}` : '<p class="quiz-placeholder">「問題を作る」を押すと4つの出来事が表示されます。</p>'}
        </section>
        <div class="timeline-list">${items.map((item) => `<article><time>${escapeHtml(item.year)}</time><div><span>${escapeHtml(item.era)}・${escapeHtml(item.category)}</span><h2>${termMarkup(item)}</h2><p>${escapeHtml(item.clue)}</p></div></article>`).join("") || '<div class="empty-inline">この条件では年代付きの語句がありません。</div>'}</div>
      </section>`;
    document.getElementById("timelineEra").addEventListener("change", (event) => { state.timelineEra = event.target.value; state.timelineQuiz = null; renderTimelineView(); });
    document.getElementById("newTimelineQuiz").addEventListener("click", makeTimelineQuiz);
    elements.studyContent.querySelectorAll("[data-timeline-choice]").forEach((button) => button.addEventListener("click", () => selectTimelineItem(button.dataset.timelineChoice)));
    document.getElementById("retryTimelineQuiz")?.addEventListener("click", () => { state.timelineQuiz.selected = []; state.timelineQuiz.result = null; renderTimelineView(); });
  }

  function downloadFile(filename, content, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement("a");
    anchor.href = url;
    anchor.download = filename;
    document.body.append(anchor);
    anchor.click();
    anchor.remove();
    URL.revokeObjectURL(url);
  }

  function exportBackup() {
    const payload = { version: 2, exportedAt: new Date().toISOString(), records: state.records, favorites: [...state.favorites], customCards };
    downloadFile("rekishi-card-backup.json", JSON.stringify(payload, null, 2), "application/json");
  }

  function exportQuestionsJson() {
    downloadFile("rekishi-card-questions.json", JSON.stringify({ version: 1, questions: cards }, null, 2), "application/json");
  }

  function csvEscape(value) {
    const text = String(value ?? "");
    return /[",\n]/.test(text) ? `"${text.replaceAll('"', '""')}"` : text;
  }

  function exportQuestionsCsv() {
    const headers = ["id", "term", "reading", "era", "category", "clue", "year", "note", "level"];
    const lines = [headers.join(","), ...cards.map((item) => headers.map((key) => csvEscape(item[key])).join(","))];
    downloadFile("rekishi-card-questions.csv", `\ufeff${lines.join("\n")}`, "text/csv;charset=utf-8");
  }

  function parseCsv(text) {
    const rows = [];
    let row = [];
    let field = "";
    let quoted = false;
    for (let index = 0; index < text.length; index += 1) {
      const character = text[index];
      if (quoted) {
        if (character === '"' && text[index + 1] === '"') { field += '"'; index += 1; }
        else if (character === '"') quoted = false;
        else field += character;
      } else if (character === '"') quoted = true;
      else if (character === ",") { row.push(field); field = ""; }
      else if (character === "\n") { row.push(field.replace(/\r$/, "")); rows.push(row); row = []; field = ""; }
      else field += character;
    }
    if (field || row.length) { row.push(field.replace(/\r$/, "")); rows.push(row); }
    if (!rows.length) return [];
    const headers = rows.shift().map((header) => header.replace(/^\ufeff/, "").trim());
    return rows.filter((values) => values.some(Boolean)).map((values) => Object.fromEntries(headers.map((header, index) => [header, values[index] || ""])));
  }

  function normalizeImportedCard(item, index, preserveId = false) {
    if (!item || !String(item.term || "").trim() || !String(item.clue || "").trim()) return null;
    const levelText = String(item.level || "elementary").toLowerCase();
    const level = levelText === "middle" || levelText.includes("中") ? "middle" : "elementary";
    const safeId = preserveId && /^custom-[a-z0-9-]+$/i.test(String(item.id || "")) ? item.id : `custom-${Date.now().toString(36)}-${index}-${Math.random().toString(36).slice(2, 7)}`;
    return {
      id: safeId,
      term: String(item.term).trim(),
      reading: String(item.reading || "").trim(),
      era: String(item.era || "未分類").trim(),
      category: String(item.category || "その他").trim(),
      clue: String(item.clue).trim(),
      year: String(item.year || "").trim() || undefined,
      note: String(item.note || "").trim() || undefined,
      level,
      custom: true,
    };
  }

  function addImportedCards(items, preserveIds = false) {
    const existing = new Set(cards.map((item) => `${item.level}|${item.term}|${item.reading}|${item.era}`));
    let added = 0;
    items.forEach((item, index) => {
      const normalized = normalizeImportedCard(item, index, preserveIds);
      if (!normalized) return;
      const key = `${normalized.level}|${normalized.term}|${normalized.reading}|${normalized.era}`;
      if (existing.has(key)) return;
      existing.add(key);
      customCards.push(normalized);
      added += 1;
    });
    safeSave(customCardsKey, customCards);
    rebuildCards();
    eraOrder.forEach((era) => state.selectedEras.add(era));
    return added;
  }

  async function importData(file) {
    try {
      const text = await file.text();
      let added = 0;
      if (file.name.toLowerCase().endsWith(".csv")) {
        added = addImportedCards(parseCsv(text));
        state.importMessage = `${added}件の新しい問題を追加しました。`;
      } else {
        const data = JSON.parse(text);
        if (Array.isArray(data)) added = addImportedCards(data);
        else if (Array.isArray(data.questions)) added = addImportedCards(data.questions);
        if (data && !Array.isArray(data) && (data.records || data.favorites || data.customCards)) {
          if (Array.isArray(data.customCards)) added += addImportedCards(data.customCards, true);
          if (data.records && typeof data.records === "object") state.records = { ...state.records, ...data.records };
          if (Array.isArray(data.favorites)) state.favorites = new Set([...state.favorites, ...data.favorites]);
          saveRecords();
          saveFavorites();
          state.importMessage = `バックアップを復元しました。追加問題は${added}件です。`;
        } else state.importMessage = `${added}件の新しい問題を追加しました。`;
      }
    } catch (_error) {
      state.importMessage = "読み込みに失敗しました。JSONまたはCSVの形式を確認してください。";
    }
    render();
  }

  function renderDataView() {
    elements.studyContent.innerHTML = `
      <section class="tool-view">
        <div class="view-heading"><div><p class="eyebrow">DATA TOOLS</p><h1>データの保存・読み込み</h1><p>学習記録をバックアップし、JSON・CSVで問題を追加できます。</p></div></div>
        ${state.importMessage ? `<p class="notice">${escapeHtml(state.importMessage)}</p>` : ""}
        <div class="data-grid">
          <section class="data-card"><span class="data-icon" aria-hidden="true">⇩</span><h2>バックアップ</h2><p>学習記録・お気に入り・追加問題を1つのJSONファイルに保存します。</p><button class="primary-action" id="exportBackup" type="button">バックアップJSON</button></section>
          <section class="data-card"><span class="data-icon" aria-hidden="true">表</span><h2>問題を書き出す</h2><p>全${cards.length}問を編集用ファイルとして保存します。</p><div class="button-row"><button class="secondary-action" id="exportQuestionsJson" type="button">JSON</button><button class="secondary-action" id="exportQuestionsCsv" type="button">CSV</button></div></section>
          <section class="data-card"><span class="data-icon" aria-hidden="true">⇧</span><h2>読み込む</h2><p>バックアップJSON、問題一覧JSON、CSVを読み込めます。既存語句は重複追加しません。</p><label class="file-button">ファイルを選ぶ<input id="importFile" type="file" accept=".json,.csv,application/json,text/csv"></label></section>
        </div>
        <section class="format-help"><h2>問題ファイルの項目</h2><code>term, reading, era, category, clue, year, note, level</code><p><b>term</b>（語句）と<b>clue</b>（説明）は必須です。levelは小学生ならelementary、中学生ならmiddleです。</p><p>追加した問題と学習記録は、この端末のブラウザ内だけに保存されます。</p></section>
      </section>`;
    document.getElementById("exportBackup").addEventListener("click", exportBackup);
    document.getElementById("exportQuestionsJson").addEventListener("click", exportQuestionsJson);
    document.getElementById("exportQuestionsCsv").addEventListener("click", exportQuestionsCsv);
    document.getElementById("importFile").addEventListener("change", (event) => { if (event.target.files?.[0]) importData(event.target.files[0]); });
  }

  function render() {
    const deck = getDeck();
    renderViewTabs();
    renderEraButtons();
    renderCategoryOptions();

    elements.elementaryLevel.classList.toggle("active", state.schoolLevel === "elementary");
    elements.middleLevel.classList.toggle("active", state.schoolLevel === "middle");
    elements.allLevels.classList.toggle("active", state.schoolLevel === "all");
    elements.elementaryLevel.setAttribute("aria-pressed", String(state.schoolLevel === "elementary"));
    elements.middleLevel.setAttribute("aria-pressed", String(state.schoolLevel === "middle"));
    elements.allLevels.setAttribute("aria-pressed", String(state.schoolLevel === "all"));
    elements.toggleAllEras.textContent = state.selectedEras.size === eraOrder.length ? "すべて外す" : "すべて選ぶ";
    elements.clueDirection.classList.toggle("active", state.direction === "clue");
    elements.termDirection.classList.toggle("active", state.direction === "term");
    elements.choiceDirection.classList.toggle("active", state.direction === "choice");
    elements.clueDirection.setAttribute("aria-pressed", String(state.direction === "clue"));
    elements.termDirection.setAttribute("aria-pressed", String(state.direction === "term"));
    elements.choiceDirection.setAttribute("aria-pressed", String(state.direction === "choice"));
    elements.randomToggle.checked = state.randomOrder;
    elements.reviewToggle.checked = state.reviewOnly;
    const baseFilteredCards = cards.filter(matchesBaseFilters);
    const unsureCount = baseFilteredCards.filter(isUnsure).length;
    const wrongCount = baseFilteredCards.filter(isWrong).length;
    const weakCount = baseFilteredCards.filter(isWeak).length;
    elements.weakTotalCount.textContent = `${weakCount}問`;
    elements.unsureReviewCount.textContent = unsureCount;
    elements.wrongReviewCount.textContent = wrongCount;
    elements.weakReviewCount.textContent = weakCount;
    elements.savedWeakCount.textContent = `${getLevelCards().filter(isWeak).length}問`;
    document.querySelectorAll("[data-focus-mode]").forEach((button) => {
      const active = button.dataset.focusMode === state.focusMode;
      button.classList.toggle("active", active);
      button.setAttribute("aria-pressed", String(active));
    });
    elements.furiganaToggle.checked = state.furigana;
    elements.selectedCount.textContent = `${deck.length}問`;
    elements.dueCount.textContent = `${getLevelCards().filter((item) => isDue(item)).length}問`;
    elements.studyTitle.textContent = studyModeTitle();
    elements.activeFilters.textContent = `${levelLabel()} ／ ${state.selectedEras.size === eraOrder.length ? "すべての時代" : [...state.selectedEras].join("・") || "時代未選択"} ／ ${state.category}`;
    elements.againCount.textContent = state.session.again;
    elements.unsureCount.textContent = state.session.unsure;
    elements.masteredCountSession.textContent = state.session.mastered;
    elements.studyHeader.hidden = state.view !== "study";
    elements.overallCard.hidden = state.view !== "study";

    if (state.view === "study") renderStudy(deck);
    else if (state.view === "test") renderTestView();
    else if (state.view === "list") renderListView();
    else if (state.view === "progress") renderProgressView();
    else if (state.view === "timeline") renderTimelineView();
    else renderDataView();
    renderOverall();
  }

  function initializeControls() {
    if (!cards.length || !eraOrder.length) {
      elements.studyContent.innerHTML = '<div class="empty-state"><h2>問題データを読み込めませんでした</h2><p>HTMLファイル、questions.js、middle-questions.jsを同じフォルダに置いてください。</p></div>';
      return;
    }

    elements.viewTabs.querySelectorAll("[data-view]").forEach((button) => button.addEventListener("click", () => setView(button.dataset.view)));
    elements.openFilters.addEventListener("click", () => setFilterOpen(true));
    elements.closeFilters.addEventListener("click", () => setFilterOpen(false));
    elements.filterBackdrop.addEventListener("click", () => setFilterOpen(false));
    elements.furiganaToggle.addEventListener("change", (event) => { state.furigana = event.target.checked; render(); });
    const setSchoolLevel = (level) => {
      state.schoolLevel = level;
      state.category = "すべて";
      state.listEra = "すべて";
      state.listCategory = "すべて";
      state.timelineEra = "すべて";
      state.timelineQuiz = null;
      state.testSession = null;
      clearTestTimer();
      resetCardPosition();
      render();
    };
    elements.elementaryLevel.addEventListener("click", () => setSchoolLevel("elementary"));
    elements.middleLevel.addEventListener("click", () => setSchoolLevel("middle"));
    elements.allLevels.addEventListener("click", () => setSchoolLevel("all"));
    elements.toggleAllEras.addEventListener("click", () => {
      state.selectedEras = state.selectedEras.size === eraOrder.length ? new Set() : new Set(eraOrder);
      resetCardPosition();
      render();
    });
    elements.categorySelect.addEventListener("change", (event) => { state.category = event.target.value; resetCardPosition(); render(); });
    elements.clueDirection.addEventListener("click", () => { state.direction = "clue"; resetCardPosition(); render(); });
    elements.termDirection.addEventListener("click", () => { state.direction = "term"; resetCardPosition(); render(); });
    elements.choiceDirection.addEventListener("click", () => { state.direction = "choice"; resetCardPosition(); render(); });
    elements.randomToggle.addEventListener("change", (event) => { state.randomOrder = event.target.checked; resetCardPosition(); render(); });
    elements.reviewToggle.addEventListener("change", (event) => {
      state.reviewOnly = event.target.checked;
      if (state.reviewOnly) state.focusMode = "none";
      resetCardPosition();
      render();
    });
    document.querySelectorAll("[data-focus-mode]").forEach((button) => button.addEventListener("click", () => {
      state.focusMode = state.focusMode === button.dataset.focusMode ? "none" : button.dataset.focusMode;
      state.reviewOnly = false;
      state.view = "study";
      state.seed = Date.now();
      resetCardPosition();
      setFilterOpen(false);
      render();
    }));
    elements.startLearning.addEventListener("click", () => {
      state.seed = Date.now();
      state.view = "study";
      resetCardPosition();
      setFilterOpen(false);
      render();
      document.getElementById("top").scrollIntoView({ behavior: "smooth" });
    });
    elements.resetProgress.addEventListener("click", () => {
      if (!window.confirm("この端末に保存した学習記録をすべて消去しますか？")) return;
      state.records = {};
      state.session = { mastered: 0, unsure: 0, again: 0 };
      state.focusMode = "none";
      saveRecords();
      resetCardPosition();
      render();
    });

    window.addEventListener("keydown", (event) => {
      if (state.view !== "study" || ["INPUT", "SELECT", "BUTTON", "TEXTAREA"].includes(event.target.tagName)) return;
      if (state.direction === "choice" && !state.revealed && ["1", "2", "3", "4"].includes(event.key)) {
        const current = getDeck()[state.index];
        const choice = current ? getChoices(current)[Number(event.key) - 1] : null;
        if (choice) selectChoice(choice.id);
      } else if (event.code === "Space" && state.direction !== "choice") {
        event.preventDefault();
        state.revealed = !state.revealed;
        render();
      } else if (event.key === "ArrowLeft") previousCard();
      else if (event.key === "ArrowRight") nextCard();
      else if (event.key === "1") rateCard("again");
      else if (event.key === "2") rateCard("unsure");
      else if (event.key === "3") rateCard("mastered");
      else if (event.key === "Escape" && state.filtersOpen) setFilterOpen(false);
    });

    render();
  }

  initializeControls();
})();
  </script>
